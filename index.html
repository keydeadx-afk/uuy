<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шумоізоляція Авто Чернівці | Покроковий Калькулятор VSAUTO 0542</title>
    <style>
        /* --- CSS Стилі (Дизайн) --- */
        :root {
            --bg-color: #0b0c10; /* Глибокий чорний */
            --text-color: #c5c6c7; /* Світло-сірий */
            --accent-cyan: #00f0ff; /* Електрик ціан */
            --accent-hover: #00b8c4;
            --accent-magenta: #ff00ff; /* Акцент для Преміуму */
            --card-bg: #1f2833; /* Темно-сірий для карток */
            --border-color: #45a29e;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        /* Хедер */
        header {
            background-color: rgba(11, 12, 16, 0.9);
            padding: 20px 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .city {
            font-size: 0.9rem;
            color: var(--border-color);
        }

        /* Квіз-контейнер */
        .calc-container {
            max-width: 900px;
            margin: 120px auto 30px;
            padding: 0 20px;
        }

        /* Приховати всі кроки за замовчуванням */
        .calc-step {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        /* Показати активний крок */
        .calc-step.active {
            display: block;
            opacity: 1;
        }

        .calc-section {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.1);
            margin-bottom: 20px;
        }

        .calc-step-title {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 20px;
            border-left: 3px solid var(--accent-cyan);
            padding-left: 10px;
            text-transform: uppercase;
        }

        /* Стилізація вибору кузова */
        .type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .type-option {
            position: relative;
        }

        .type-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .type-label {
            display: block;
            background-color: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            color: var(--text-color);
        }

        .type-option input:checked + .type-label {
            border-color: var(--accent-cyan);
            background-color: rgba(0, 240, 255, 0.1);
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        /* Стилізація зон (чекбокси) */
        .zones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .checkbox-option, .radio-option {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 1rem;
            padding: 10px;
            background: rgba(255,255,255,0.02);
            border-radius: 4px;
        }

        .checkbox-option input, .radio-option input {
            margin-right: 15px;
            accent-color: var(--accent-cyan);
            width: 18px;
            height: 18px;
        }

        /* Пакет матеріалів (з особливим акцентом) */
        .package-select {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 10px;
        }

        .package-option input:checked + .type-label[for="package_economy"] {
            border-color: var(--accent-cyan);
            background-color: rgba(0, 240, 255, 0.1);
        }

        .package-option input:checked + .type-label[for="package_premium"] {
            border-color: var(--accent-magenta);
            background-color: rgba(255, 0, 255, 0.1);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
        }

        /* Аналіз Заявки */
        .analysis-section {
            border-color: var(--accent-magenta);
        }

        .analysis-list {
            list-style: none;
        }

        .analysis-list li {
            font-size: 0.95rem;
            color: var(--border-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .analysis-list li::before {
            content: '✓';
            color: var(--accent-cyan);
            margin-right: 10px;
            font-weight: bold;
        }

        /* Підсумок ціни */
        .total-box {
            text-align: center;
            background-color: var(--bg-color);
            border: 2px solid var(--accent-magenta);
            padding: 20px 40px;
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            margin-top: 20px;
        }

        .total-label {
            font-size: 1rem;
            text-transform: uppercase;
            color: var(--border-color);
            letter-spacing: 1px;
        }

        .total-price {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
        }

        .total-price span {
            color: var(--accent-cyan);
            font-size: 1.5rem;
            margin-left: 5px;
        }

        .disclaimer {
            font-size: 0.8rem;
            color: var(--border-color);
            margin-top: 5px;
        }

        /* Кнопки Навігації */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid var(--accent-cyan);
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
            background: transparent;
            color: var(--accent-cyan);
        }

        .btn:hover {
            background-color: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .btn-magenta {
            border-color: var(--accent-magenta);
            color: var(--accent-magenta);
        }

        .btn-magenta:hover {
            background-color: var(--accent-magenta);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        /* Адаптивність */
        @media (max-width: 600px) {
            .hero h1 { font-size: 1.8rem; }
            .total-price { font-size: 2rem; }
            .total-box { padding: 15px 25px; }
            .package-select { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">VSAUTO<span style="color:#fff"> 0542</span></div>
    <div class="city">м. Чернівці</div>
</header>

<div class="calc-container" id="quiz_container">

    <!-- Крок 1: Кузов -->
    <div class="calc-step active" data-step="1">
        <div class="calc-section">
            <div class="calc-step-title">1. Оберіть тип кузова</div>
            <div class="type-grid">
                <div class="type-option">
                    <input type="radio" id="type_sedan" name="car_type" value="sedan" checked>
                    <label for="type_sedan" class="type-label">Седан</label>
                </div>
                <div class="type-option">
                    <input type="radio" id="type_suv" name="car_type" value="suv">
                    <label for="type_suv" class="type-label">Кросовер</label>
                </div>
                <div class="type-option">
                    <input type="radio" id="type_offroad" name="car_type" value="offroad">
                    <label for="type_offroad" class="type-label">Позашляховик</label>
                </div>
            </div>
        </div>
        <div class="nav-buttons">
            <button class="btn next-step">Далі</button>
        </div>
    </div>

    <!-- Крок 2: Зони Шумки -->
    <div class="calc-step" data-step="2">
        <div class="calc-section">
            <div class="calc-step-title">2. Оберіть зони обробки</div>
            <div class="zones-grid">
                <label class="checkbox-option"><input type="checkbox" name="zone" value="doors" checked>Двері (4 шт)</label>
                <label class="checkbox-option"><input type="checkbox" name="zone" value="floor">Салон (Підлога)</label>
                <label class="checkbox-option"><input type="checkbox" name="zone" value="trunk">Багажник</label>
                <label class="checkbox-option"><input type="checkbox" name="zone" value="arches">Арки (Внутрішні)</label>
            </div>
        </div>
        <div class="nav-buttons">
            <button class="btn prev-step">Назад</button>
            <button class="btn next-step">Далі</button>
        </div>
    </div>

    <!-- Крок 3: Матеріал -->
    <div class="calc-step" data-step="3">
        <div class="calc-section">
            <div class="calc-step-title">3. Оберіть пакет матеріалів</div>
            <div class="package-select">
                <div class="type-option package-option">
                    <input type="radio" id="package_economy" name="package" value="economy" checked>
                    <label for="package_economy" class="type-label">Економ</label>
                </div>
                <div class="type-option package-option">
                    <input type="radio" id="package_premium" name="package" value="premium">
                    <label for="package_premium" class="type-label">Преміум</label>
                </div>
            </div>
        </div>
        <div class="nav-buttons">
            <button class="btn prev-step">Назад</button>
            <button class="btn btn-magenta finalize-quiz">Розрахувати</button>
        </div>
    </div>

    <!-- Крок 4: ФІНАЛ -->
    <div class="calc-step" data-step="4" id="final_step">
        <div class="calc-section analysis-section">
            <div class="calc-step-title">Аналіз вашої заявки</div>
            <ul class="analysis-list" id="analysis_summary">
                <!-- Сюди JS додасть підсумок -->
            </ul>
        </div>
        <div style="text-align: center;">
            <div class="total-box">
                <div class="total-label">Орієнтовна вартість:</div>
                <div class="total-price" id="final_price">0<span>грн</span></div>
                <div class="disclaimer">*точно після огляду майстром VSAUTO</div>
            </div>
        </div>
        <div class="nav-buttons">
            <button class="btn btn-magenta" onclick="location.reload()">Розрахувати заново</button>
        </div>
    </div>

</div>

<footer>
    © 2026 VSAUTO 0542 Чернівці. Професійна шумоізоляція.
</footer>

<script>
    /* --- JAVASCRIPT ЛОГІКА (Покроковий Калькулятор) --- */

    // 1. Дані та коефіцієнти
    const pricingData = {
        baseDoorsEcon: 8000, // База: Двері Седана (Економ)
        premiumMultiplier: 1.25, // Різниця Економ/Преміум (+25%)
        specialCrossoverDoorsEcon: 7500, // Специфічна ціна на двері Кросовера (ТЗ)
        
        zonesRel: { doors: 1.0, floor: 1.4, trunk: 0.8, arches: 0.6 }, // Коефіцієнти зон
        bodyModifiers: { sedan: 1.0, suv: 1.2, offroad: 1.4 } // Коефіцієнти кузова (для ВСЬОГО, крім дверей)
    };

    // Словники для перекладу підсумку
    const translate = {
        sedan: 'Седан', suv: 'Кросовер', offroad: 'Позашляховик',
        doors: 'Двері (4 шт)', floor: 'Салон (Підлога)', trunk: 'Багажник', arches: 'Арки',
        economy: 'Економ', premium: 'Преміум'
    };

    // 2. Логіка навігації квізу
    const container = document.getElementById('quiz_container');
    
    container.addEventListener('click', function(e) {
        const activeStep = document.querySelector('.calc-step.active');
        const currentStepNum = parseInt(activeStep.dataset.step);

        if (e.target.classList.contains('next-step')) {
            // Перехід ДАЛІ
            activeStep.classList.remove('active');
            const nextStep = document.querySelector(`.calc-step[data-step="${currentStepNum + 1}"]`);
            nextStep.classList.add('active');
        } else if (e.target.classList.contains('prev-step')) {
            // Перехід НАЗАД
            activeStep.classList.remove('active');
            const prevStep = document.querySelector(`.calc-step[data-step="${currentStepNum - 1}"]`);
            prevStep.classList.add('active');
        } else if (e.target.classList.contains('finalize-quiz')) {
            // ФІНАЛЬНИЙ РОЗРАХУНОК
            performFinalCalculation();
            activeStep.classList.remove('active');
            document.getElementById('final_step').classList.add('active');
        }
    });

    // 3. Логіка розрахунку та аналізу
    function performFinalCalculation() {
        // Отримуємо всі дані
        const carType = document.querySelector('input[name="car_type"]:checked').value;
        const selectedZones = document.querySelectorAll('input[name="zone"]:checked');
        const packageType = document.querySelector('input[name="package"]:checked').value;

        // Модифікатори
        const matMultiplier = (packageType === 'premium') ? pricingData.premiumMultiplier : 1;
        const bodyMod = pricingData.bodyModifiers[carType];

        let total = 0;
        let summaryZones = [];

        // А. Розрахунок зон
        selectedZones.forEach(zoneCheckbox => {
            const zone = zoneCheckbox.value;
            let zonePrice = 0;

            if (zone === 'doors') {
                // Особлива ціна для дверей (ТЗ)
                zonePrice = (carType === 'suv') ? pricingData.specialCrossoverDoorsEcon : pricingData.baseDoorsEcon;
                zonePrice *= matMultiplier;
            } else {
                // Стандартна логіка для інших зон
                zonePrice = pricingData.baseDoorsEcon * pricingData.zonesRel[zone] * bodyMod * matMultiplier;
            }

            total += zonePrice;
            summaryZones.push(translate[zone]);
        });

        // Б. Вивід Аналізу та Ціни
        
        // 1. Аналіз Заявки
        const analysisList = document.getElementById('analysis_summary');
        analysisList.innerHTML = `
            <li>Авто: ${translate[carType]}</li>
            <li>Обрані зони: ${summaryZones.join(', ')}</li>
            <li>Пакет: ${translate[packageType]}</li>
        `;

        // 2. Фінальна ціна (округлена)
        const formattedPrice = Math.round(total).toLocaleString('uk-UA');
        document.getElementById('final_price').innerHTML = `${formattedPrice}<span>грн</span>`;
    }

</script>

</body>
</html>
