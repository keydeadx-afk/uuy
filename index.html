<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>3D конфігуратор шумоізоляції</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#0a0a0a; color:#eee; overflow:hidden; }
  #scene { position:fixed; inset:0; z-index:0; }
  #ui {
    position:fixed; inset:0; z-index:1; pointer-events:none;
    display:grid; grid-template-columns: 280px 1fr 280px; gap:16px; padding:24px;
  }
  .panel {
    pointer-events:auto; background:rgba(20,20,20,.75); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:16px;
    align-self:start; max-height:90vh; overflow:auto;
  }
  .panel h3 { margin:0 0 12px; font-size:14px; text-transform:uppercase; letter-spacing:.1em; color:#888; }
  .panel button {
    display:block; width:100%; text-align:left; margin-bottom:6px; padding:10px 12px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    color:#eee; border-radius:10px; cursor:pointer; font-size:14px; transition:.2s;
  }
  .panel button:hover { background:rgba(255,255,255,.12); }
  .panel button.active { background:#ff5722; border-color:#ff5722; color:#fff; }
  #price {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:2;
    background:rgba(20,20,20,.85); border:1px solid rgba(255,255,255,.1);
    padding:14px 28px; border-radius:999px; font-size:18px; pointer-events:none;
  }
  #price b { color:#ff5722; }
  @media (max-width:800px){ #ui{grid-template-columns:1fr;} .panel{max-height:30vh;} }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="ui">
  <div class="panel">
    <h3>Авто</h3>
    <button data-car="sedan" class="active">Седан (напр. BMW 3)</button>
    <button data-car="suv">Позашляховик (напр. X5)</button>
    <button data-car="hatch">Хетчбек (напр. Golf)</button>
  </div>

  <div></div>

  <div class="panel">
    <h3>Шумоізоляція</h3>
    <button data-zone="doors">Двері</button>
    <button data-zone="floor">Підлога</button>
    <button data-zone="arches">Арки</button>
    <button data-zone="roof">Дах</button>
    <button data-zone="trunk">Багажник</button>
  </div>
</div>

<div id="price">Орієнтовно: <b>—</b></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- сцена ----
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.Fog(0x0a0a0a, 8, 22);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(4, 2.2, 5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.target.set(0, 0.6, 0);

// ---- свет ----
scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(5, 8, 5);
key.castShadow = true;
scene.add(key);
const rim = new THREE.DirectionalLight(0xff5722, 1.5);
rim.position.set(-6, 3, -4);
scene.add(rim);

// ---- пол ----
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(10, 64),
  new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.8, metalness:0.2 })
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// ---- «авто» (параметрический кузов) ----
// Группа хранит меши, у каждого меша есть userData.zone
const carGroup = new THREE.Group();
scene.add(carGroup);

const bodyMat = new THREE.MeshStandardMaterial({ color:0x3a3a3a, metalness:0.9, roughness:0.35 });
const glowMat = (zone) => new THREE.MeshStandardMaterial({
  color:0xff5722, emissive:0xff5722, emissiveIntensity:0.0, transparent:true, opacity:0.55
});

// Функция строит кузов в зависимости от типа
function buildCar(type = 'sedan') {
  carGroup.clear();

  const cfg = {
    sedan: { len:2.4, bodyH:0.55, cabH:0.45, cabLen:1.4, cabShift:0.0,  archY:0.35, trunk:0.5 },
    suv:   { len:2.4, bodyH:0.75, cabH:0.65, cabLen:1.7, cabShift:-0.1, archY:0.45, trunk:0.6 },
    hatch: { len:2.0, bodyH:0.55, cabH:0.5,  cabLen:1.3, cabShift:-0.2, archY:0.35, trunk:0.35 }
  }[type];

  // Нижняя часть (порог)
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, cfg.bodyH, cfg.len), bodyMat);
  body.position.y = cfg.bodyH/2 + 0.15;
  body.castShadow = true; body.receiveShadow = true;
  carGroup.add(body);

  // Кабина
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, cfg.cabH, cfg.cabLen), bodyMat);
  cabin.position.set(0, body.position.y + cfg.bodyH/2 + cfg.cabH/2, cfg.cabShift);
  cabin.castShadow = true;
  carGroup.add(cabin);

  // Крыша — зона
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.06, cfg.cabLen*0.9), glowMat());
  roof.position.set(0, cabin.position.y + cfg.cabH/2 + 0.03, cfg.cabShift);
  roof.userData.zone = 'roof';
  carGroup.add(roof);

  // Дверь левая — зона
  const doorL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.35, 0.9), glowMat());
  doorL.position.set(-0.92, body.position.y + 0.05, 0.1);
  doorL.userData.zone = 'doors';
  carGroup.add(doorL);
  const doorR = doorL.clone();
  doorR.position.x = 0.92;
  carGroup.add(doorR);

  // Пол — зона
  const floorZone = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.05, cfg.len*0.85), glowMat());
  floorZone.position.set(0, 0.2, 0);
  floorZone.userData.zone = 'floor';
  carGroup.add(floorZone);

  // Арки — зона (две)
  [-1, 1].forEach(sign => {
    const arch = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.06, 8, 24, Math.PI), glowMat());
    arch.rotation.z = Math.PI/2;
    arch.rotation.y = Math.PI/2;
    arch.position.set(sign*0.9, cfg.archY, sign*0.7);
    arch.userData.zone = 'arches';
    carGroup.add(arch);
  });

  // Багажник — зона
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.05, 0.45), glowMat());
  trunk.position.set(0, body.position.y + cfg.bodyH/2 + 0.02, -cfg.len/2 + 0.25);
  trunk.userData.zone = 'trunk';
  carGroup.add(trunk);

  // Колёса (не зоны)
  const wheelMat = new THREE.MeshStandardMaterial({ color:0x0a0a0a, roughness:0.6 });
  const wheelGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.18, 24);
  [[-0.92,0.65],[0.92,0.65],[-0.92,-0.75],[0.92,-0.75]].forEach(([x,z])=>{
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(x, 0.28, z);
    w.castShadow = true;
    carGroup.add(w);
  });

  // Плавный «наплыв» — анимация появления
  carGroup.scale.set(0.01,0.01,0.01);
  const t0 = performance.now();
  const anim = () => {
    const p = Math.min((performance.now()-t0)/600, 1);
    const s = 1 - Math.pow(1-p, 3);
    carGroup.scale.setScalar(s);
    if (p<1) requestAnimationFrame(anim);
  };
  anim();
}
buildCar('sedan');

// ---- выбранные зоны ----
const selectedZones = new Set();
const glowTargets = [];

function collectGlowMeshes() {
  glowTargets.length = 0;
  carGroup.traverse(o => { if (o.userData?.zone) glowTargets.push(o); });
}
collectGlowMeshes();

// ---- UI логика ----
document.querySelectorAll('[data-car]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-car]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    buildCar(btn.dataset.car);
    collectGlowMeshes();
  });
});

document.querySelectorAll('[data-zone]').forEach(btn => {
  btn.addEventListener('click', () => {
    const z = btn.dataset.zone;
    if (selectedZones.has(z)) { selectedZones.delete(z); btn.classList.remove('active'); }
    else { selectedZones.add(z); btn.classList.add('active'); }
    updatePrice();
  });
});

// ---- цена (пример) ----
const ZONE_PRICE = { doors:2500, floor:4000, arches:3000, roof:2000, trunk:1500 };
const CAR_COEF = { sedan:1, suv:1.3, hatch:0.9 };
let currentCar = 'sedan';
document.querySelectorAll('[data-car]').forEach(b=>b.addEventListener('click',()=>currentCar=b.dataset.car));

function updatePrice() {
  let sum = 0;
  selectedZones.forEach(z => sum += ZONE_PRICE[z] || 0);
  sum = Math.round(sum * (CAR_COEF[currentCar]||1));
  document.querySelector('#price b').textContent = sum ? sum + ' грн' : '—';
}

// ---- анимация пульсации зон ----
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  const pulse = (Math.sin(t*3)+1)/2;

  glowTargets.forEach(mesh => {
    const z = mesh.userData.zone;
    const active = selectedZones.has(z);
    const target = active ? 0.6 + pulse*0.8 : 0.0;
    mesh.material.emissiveIntensity += (target - mesh.material.emissiveIntensity) * 0.1;
    mesh.material.opacity = 0.15 + (active ? pulse*0.6 : 0);
    mesh.material.visible = true;
  });

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
